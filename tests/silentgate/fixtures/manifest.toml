# ---------------------------------------------------------------------------
# CORPUS-WIDE INVARIANTS
#
# Tripwires on the archive, not on the detector. The corpus is allowed to GROW
# -- S3 is live -- so the suite checks that nothing DISAPPEARS and that no
# unrecognised symmetry-header form appears, rather than freezing the counts.

[corpus]
tracked_out_files = 515
with_symmetry_header = 173
no_symmetry_found_only = 312
neither_marker = 30
with_force_decomposition_blocks = 11

# The pw.x symmetry header has FOUR distinct textual forms in this repo's own
# corpus. A9.1 :1836 registers that the reader "accepts both forms by regex and
# logs the form encountered per file", where "both" means the count-first form
# of pw.x 7.5 and the count-LAST form shown in symops_audit.py's own docstring
# ("Sym. Ops., with inversion, found          4 symmetry operations").
#
# Measured: ZERO files here use the count-last form, and FOUR count-first
# variants do. A regex anchored on "(no inversion)" misses 32 of the 173 files
# that carry a header.
#
# The count-last form has now been looked for OUTSIDE this repo too and not
# found. A9.7's act-2 dated line (2026-08-23, the first parse) validated four
# RuO2 4-layer Xu outputs and records: "all four are the count-first form; the
# older docstring form was not encountered; no reader fix is needed and the
# both-forms-by-regex rule stands". Their exact text, `4 Sym. Ops. (no
# inversion) found` / `2 Sym. Ops. (no inversion) found`, is the same variant as
# the 13 in-house files below.
#
# So the both-forms requirement is registered but has never been exercised
# against real count-last data anywhere -- 0 in-house, 0 in the four Xu files
# read. P-XU's six blind metals are still unread, so the form cannot be ruled
# out for them. Recorded so "accepts both forms" is not mistaken for "tested on
# both forms".
[corpus.header_forms]
"N Sym. Ops. (no inversion) found ( N have fractional translation)" = 128
"N Sym. Ops., with inversion, found" = 21
"N Sym. Ops. (no inversion) found" = 13
"N Sym. Ops., with inversion, found ( N have fractional translation)" = 11

# Files carrying force-DECOMPOSITION blocks. Each has ONE real force block and
# SIX contribution blocks in the identical `atom N type M force =` format, so a
# regex that scrapes force lines without delimiting blocks reads 7x the ionic
# steps and mixes partial forces into the census. None currently carries an
# adsorbate tag, so no archived CSV row is wrong -- but a per-step detector that
# inherits this bug is wrong on every one of them.
[corpus.force_decomposition_files]
paths = [
  "runs/hp_tio2/scf__atomic.out",
  "runs/hp_tio2/scf__cro2.out",
  "runs/hp_tio2/scf__ortho.out",
  "runs/s0/i_cutoff_ladder/sno2__ecut100.out",
  "runs/s0/i_cutoff_ladder/sno2__ecut120.out",
  "runs/s0/i_cutoff_ladder/sno2__ecut60.out",
  "runs/s0/i_cutoff_ladder/sno2__ecut80.out",
  "runs/s0/i_cutoff_ladder/tio2__ecut100.out",
  "runs/s0/i_cutoff_ladder/tio2__ecut120.out",
  "runs/s0/i_cutoff_ladder/tio2__ecut60.out",
  "runs/s0/i_cutoff_ladder/tio2__ecut80.out",
]

