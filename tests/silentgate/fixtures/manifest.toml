#
# WHAT IS AND IS NOT IN THIS FILE
# -------------------------------
# Every fixture is an EXISTING TRACKED FILE, cited by path. Nothing is copied:
# `runs/` is fully committed, so the corpus is already in the repo and
# duplicating megabytes of it would only create a second thing to drift.
#
# The recorded values are STRUCTURAL -- hashes, byte counts, which marker lines
# a file contains, how many force blocks and contribution blocks it has. They
# are file-shape facts, checkable with a hash and a substring search.
#
# No test in this suite asserts a census value or a LOCKED verdict. Machine-
# checked expectations are structural only; numeric ones enter later as GOLDEN
# FILES generated by the entrant's core and reviewed by him (tests/silentgate/
# README.md). Nothing here scores the detector.
#
# BUT READ THIS BEFORE TRUSTING THE PROSE. The `pins` and `decides` strings say
# things like "LOCKED on both lateral axes" and "the adsorbate y-column is
# exactly zero". Those ARE verdicts, and they came from an AI-written survey of
# the corpus run on 2026-08-27 -- preserved, with what it measured and why it
# needs disclosing, at docs/research/ai-survey-2026-08-27/. They are prose
# explaining why each fixture was chosen. They are not assertions, no test reads
# them, and they carry no more authority than the survey that produced them.
#
# So each fixture records what it PINS (the shape, machine-checked) and what it
# DECIDES (the question the entrant's core has to answer correctly on it, prose).
#
# HASHES ARE LF-NORMALISED ON PURPOSE. `.gitattributes` carries no rule for
# *.out and core.autocrlf=true on the entrant's machine, so the same tracked
# blob is CRLF in the Windows working tree and LF on Linux CI. sha256_lf is
# computed after CRLF -> LF, so it is identical in both places. git_blob is the
# blob SHA-1 git actually tracks, recorded as provenance.
#
# AUTHORSHIP: written by AI as "fixtures" under the A9.1 :1840 permitted list.

