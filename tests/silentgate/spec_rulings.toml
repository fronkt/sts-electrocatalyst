The adopted permission is metadata, version and entry-point. A [build-system]
table and a package-discovery entry are neither, strictly read -- but without
them the package is not installable and CI cannot invoke the CLI at all.

pyproject.toml carries them, flagged inline, because the alternative was to ship
a file that cannot build. It is one line beyond the literal permission and the
entrant decides whether to keep it or write it himself.
"""
decides = """
Whether two stanzas of pyproject.toml are AI-authored inside the permitted set
