[[question]]
id = "if_pos_parenthetical"
question = "File the correction of record against A9.1's if_pos rationale?"
registered_at = "docs/43:1834"
why = """
:1834 states, as the reason for excluding fixed atoms: "pw.x prints the
if_pos-masked force, so a fixed coordinate reads exactly zero for a reason that
is not symmetry."

Re-measured 2026-08-27 over five deck/output pairs in five metals -- 49 frozen
atoms, every ionic step of each run, 704 frozen-atom force observations: NOT ONE
prints all three components exactly zero. runs/s3/Mn/ref__2x1v.in atom 12,
flagged `0 0 0`, prints z = 0.04355221 Ry/bohr; the largest frozen-atom
component seen is 0.08723744 in runs/Cr_slab/s0_O.out. QE 7.5 prints the RAW,
unmasked force. If the mask were applied a `0 0 0` atom would read 0.00000000 on
all three axes, and none does.

A frozen atom CAN print an exact zero on one axis -- runs/Cr_slab/s0_O.out atom 1
reads `0.00000000 0.00000000 0.08723744` -- but that is the symmetry witness
doing its job, which is the opposite of what the parenthetical claims.
"""
decides = """
Nothing about the ACTION -- excluding if_pos = 0 atoms stays correct and
conservative, and adsorbate atoms are always `1 1 1`, so no production verdict
changes. What changes is a risk assessment: frozen atoms were registered as a
source of false LOCKED, and in QE 7.5 they cannot be one. The silentgate reader
must not be built on the false premise, and the report must not repeat it.
"""
fixture = "runs/Co_slab/s0_O.out"
options = ["file-the-correction", "leave-as-registered"]
ruling = "file-the-correction"
dated_line = "docs/43-prereg-week1-factorial.md:4211, 2026-09-04"

