# Core implementation authorized 2026-09-13; see docs/research/silentgate-authorship-2026-09-13.md.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
# ---------------------------------------------------------------------------

[project]
name = "silentgate"
version = "0.1.0"
description = "Detects when a relaxation was confined by a symmetry the code kept silently."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Cai", email = "frankyc11223@gmail.com" }]
keywords = [
  "quantum-espresso",
  "density-functional-theory",
  "symmetry",
  "relaxation",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
]
# No dependencies, deliberately. See the header.
dependencies = []

[project.urls]
Repository = "https://github.com/fronkt/sts-electrocatalyst"

# The console-script entry-point declaration -- explicitly permitted.
# `silentgate.cli` is the module the registered core list names (:1840). The
# function name `main` is the one free choice in this file; rename it if your
# CLI uses another.
[project.scripts]
silentgate = "silentgate.cli:main"

# ---- FLAGGED STANZA 2 of 2 -------------------------------------------------
# Explicit, not auto-discovery: this repo has several top-level directories
# (runs/, docs/, src/, anvil/, tests/, results/, data/) and flat-layout
# auto-discovery would either error or sweep them into the distribution.
# `packages = ["silentgate"]` alone would ship the top-level package and silently
# DROP `silentgate.readers` (the readers sub-package named at :1840): an explicit
# list is not recursive. `find` with an include pattern takes every package under
# silentgate/, with or without __init__.py files, and nothing outside it.
[tool.setuptools.packages.find]
include = ["silentgate*"]
# ---------------------------------------------------------------------------
